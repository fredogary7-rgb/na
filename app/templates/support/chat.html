{% extends "base.html" %}
{% block title %}Assistance{% endblock %}
{% block body_class %}chat-body{% endblock %}
{% block header %}
<div class="chat-topbar">
    <a href="{{ url_for('public.index') }}" aria-label="Retour">←</a>
    <span>Assistance</span>
</div>
{% endblock %}
{% block content %}
<div class="chat-screen">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Votre message…" autocomplete="off">
        <button type="button" id="chat-send">Envoyer</button>
    </div>
</div>
{% endblock %}
{% block footer %}{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/chat-page.js') }}"></script>
{% endblock %}
